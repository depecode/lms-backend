[package]
name = "lms_api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging & env
env_logger = "0.11"
log = "0.4"
dotenvy = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI / Swagger
utoipa = { version = "5", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["actix-web", "debug-embed"] }

# Database (PostgreSQL with async driver)
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "time", "macros", "tls-native-tls"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }


jsonwebtoken = "8"
bcrypt = "0.14"
futures = "0.3"