services:
  - type: web
    name: lms-api
    env: docker
    plan: free
    healthCheckPath: /api/v1/health/health
    # ⏱️ Gives your database migrations up to 30 seconds to finish before checking the port
    initialDelaySeconds: 30 
    envVars:
      - key: DATABASE_URL
        sync: false  
      - key: RUST_LOG
        value: info
      - key: APP_HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXP_HOURS
        value: 24